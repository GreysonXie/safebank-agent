name: Team checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test src/test/js/*.test.cjs
      - run: python -m unittest discover -s deployment -p test_team_tools.py -v
      - run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: test
          BANK_MODEL_API_KEY: ""
      - run: pip install -r agent-service/requirements.lock.txt
      - run: python -m unittest tests.test_captured_protocol tests.test_live_contract_recovery tests.test_answer_contract tests.test_preview_planning tests.test_credential_output tests.test_transfer_safety tests.test_candidate_config tests.test_model_http tests.test_task_plan tests.test_savings_task_planning tests.test_savings_plan_repair tests.test_savings_month_grounding tests.test_savings_task_mock tests.test_savings_real_case_contract tests.test_statement_followup_catalog tests.test_clarification_context tests.test_reference_feedback tests.test_transfer_clarification -v
        working-directory: agent-service
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 deployment/configure.py
      - run: python3 deployment/doctor.py
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: python3 deployment/smoke.py
      - if: failure()
        run: docker compose logs --tail=100 app mysql
      - if: always()
        run: docker compose down
  windows-tools:
    name: Windows tools (not a Docker deployment)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s deployment -p test_team_tools.py -v
        shell: powershell
      - run: .\deployment\check-windows.ps1 -Help
        shell: powershell
