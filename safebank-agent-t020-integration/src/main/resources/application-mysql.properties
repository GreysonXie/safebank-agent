# Explicit new MySQL database. No H2 fallback, schema.sql or automatic fixture import.
spring.datasource.url=${SAFEBANK_MYSQL_URL}
spring.datasource.username=${SAFEBANK_MYSQL_USER}
spring.datasource.password=${SAFEBANK_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.user=${SAFEBANK_MYSQL_MIGRATION_USER}
spring.flyway.password=${SAFEBANK_MYSQL_MIGRATION_PASSWORD}
bank.risk.schema.create-new=false
bank.context.schema.create-new=false
bank.model.api-key=
