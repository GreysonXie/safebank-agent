server.address=127.0.0.1
server.port=${SAFEBANK_PORT:8080}
spring.datasource.url=${SAFEBANK_DB_URL:jdbc:h2:file:./data/safebank;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.flyway.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.h2.console.enabled=false
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
bank.model.base-url=${BANK_MODEL_BASE_URL:https://api.deepseek.com}
bank.model.api-key=${BANK_MODEL_API_KEY:}
bank.model.name=${BANK_MODEL_NAME:deepseek-v4-pro}
bank.simulation.faults-enabled=${SAFEBANK_FAULTS_ENABLED:false}
bank.risk.schema.create-new=${SAFEBANK_RISK_FRESH_SCHEMA:false}
