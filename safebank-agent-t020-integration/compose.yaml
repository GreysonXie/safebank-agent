name: safebank-team
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python deployment/configure.py first}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SAFEBANK_MODEL_MODE: ${SAFEBANK_MODEL_MODE:-mock}
      SAFEBANK_MODEL_NAME: ${SAFEBANK_MODEL_NAME:-deepseek-flash}
      SAFEBANK_MODEL_URL: ${SAFEBANK_MODEL_URL:-https://api.deepseek.com}
      SAFEBANK_MODEL_API_KEY: ${SAFEBANK_MODEL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:${SAFEBANK_WEB_PORT:-8134}:8134"
    volumes:
      - runtime-data:/var/lib/safebank
    healthcheck:
      test: ["CMD", "python", "/app/deployment/health.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
volumes:
  mysql-data:
  runtime-data:
